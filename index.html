<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17221d">
  <meta name="description" content="기타 지판의 음, CAGED 코드폼과 화성학을 단계별로 익히는 학습 앱">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=4.9.0">
  <title>코드 앤 프렛</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="backButton" class="icon-button hidden" type="button" aria-label="이전 화면">←</button>
      <div class="title-wrap">
        <span class="eyebrow">CHORD &amp; FRET</span>
        <h1 id="screenTitle">코드 앤 프렛</h1>
      </div>
      <button id="installButton" class="ghost-button hidden" type="button">앱 설치</button>
    </header>
    <main id="screen" class="screen" tabindex="-1"></main>
  </div>
  <noscript>이 앱을 사용하려면 JavaScript를 켜 주세요.</noscript>
  <script type="module" src="app.js?v=4.9.0"></script>
</body>
</html>
